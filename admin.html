<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İdarə Paneli - Balıqçı Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Стили для красивого редактора текста -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        /* Немного подправим дизайн редактора, чтобы он вписывался в сайт */
        .ql-toolbar.ql-snow {
            background: #f4f6f8;
            border-radius: 6px 6px 0 0;
            font-family: inherit;
            border-color: #ccc;
        }

        .ql-container.ql-snow {
            border-radius: 0 0 6px 6px;
            font-family: inherit;
            font-size: 14px;
            border-color: #ccc;
        }

        .ql-editor {
            min-height: 200px;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">🔒 İdarə Paneli (Admin)</div>
        <button class="mobile-menu-btn" id="menuBtn">☰</button>
        <nav id="mainNav"><a href="index.html">Sayta qayıt</a></nav>
    </header>

    <div class="container admin-wrapper">
        <!-- ЭКРАН 1: АВТОРИЗАЦИЯ -->
        <div class="card" id="loginScreen">
            <h2 class="card-title" style="border-bottom: none;">Giriş (Авторизация)</h2>
            <input type="email" id="adminEmail" placeholder="E-poçt (Email)" class="admin-input">
            <input type="password" id="adminPassword" placeholder="Şifrə (Пароль)" class="admin-input">
            <button id="loginBtn" class="admin-btn">Daxil ol</button>
            <p id="loginError" class="msg-error">Məlumat yalnışdır</p>
        </div>

        <!-- ЭКРАН 2: ПАНЕЛЬ ДОБАВЛЕНИЯ -->
        <div class="card" id="adminScreen" style="display: none;">
            <div class="admin-header">
                <h2 class="card-title" style="margin: 0; border: none; padding: 0;">➕ Yeni məlumat</h2>
                <button id="logoutBtn" class="admin-btn-logout">Çıxış</button>
            </div>

            <label class="admin-label">Hara əlavə edilsin? (Куда публикуем?)</label>
            <select id="postCategory" class="admin-input" style="font-weight: bold;">
                <option value="encyclopedia">🐟 Ensiklopediya (Энциклопедия)</option>
                <option value="news">📰 Xəbərlər (Новости)</option>
                <!-- НОВАЯ СТРОКА: -->
                <option value="gallery">📸 Ov Hesabatları (Отчеты с рыбалки)</option>
            </select>

            <label class="admin-label">Başlıq (Заголовок / Название):</label>
            <input type="text" id="postTitle" placeholder="Məsələn: Sazan / Çəki" class="admin-input">

            <label class="admin-label">Şəklin birbaşa linki (Прямая ссылка на фото):</label>
            <input type="url" id="postImageUrl" placeholder="https://i.postimg.cc/.../sazan.jpg" class="admin-input">

            <div id="imagePreviewContainer" style="display: none; margin-bottom: 15px; text-align: center;">
                <p style="font-size: 12px; color: var(--text-light); margin-bottom: 5px;">Şəklin önbaxışı (Превью):</p>
                <img id="imagePreview" src="" alt="Preview"
                    style="max-width: 100%; max-height: 200px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            </div>

            <label class="admin-label">Mətn (Текст описания):</label>
            <!-- Вместо textarea теперь контейнер визуального редактора -->
            <div id="editor-container" style="margin-bottom: 20px; background: white;"></div>

            <button id="publishBtn" class="admin-btn">Dərc et (Опубликовать)</button>
            <p id="successMsg" class="msg-success">✅ Uğurla əlavə edildi!</p>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script> <!-- Библиотека редактора -->
    <script src="js/script.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>

</html>
